<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rextro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="mainc">
        <div class="logc">
            <h1 class="titl">Welcome Back!</h1>
            <p class="subt">Sign in to your Rextro account</p>
            
            <form id="logf">
                <div class="inpg">
                    <i class="fa-solid fa-envelope ico"></i>
                    <input type="email" id="lemail" placeholder="Email Address" required>
                </div>
                <div class="inpg">
                    <i class="fa-solid fa-lock ico"></i>
                    <input type="password" id="lpass" placeholder="Password" required>
                </div>
                <button type="submit" class="lbtn">Login</button>
            </form>
            
            <div class="divr">
                <p>Don't have an account? <a href="register.html" class="lnk">Register</a></p>
            </div>

            <div class="orln">
                <hr><span>or</span><hr>
            </div>

            <div class="socb">
                <button id="gglbtn" class="sbtn"><i class="fa-brands fa-google"></i> Google</button>
                <button id="facbtn" class="sbtn"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
                <button id="aplbtn" class="sbtn"><i class="fa-brands fa-apple"></i> Apple</button>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
